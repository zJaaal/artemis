name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc, eslint, prettier and vitest (type tests included)
      - run: pnpm run test:all

      - run: pnpm run build

      # Every entry point resolves through "exports", and nothing else does
      - run: pnpm run check-exports

      # What would be published, without publishing it
      - run: npm publish --dry-run
