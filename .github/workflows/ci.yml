name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc, eslint, prettier and vitest (type tests included)
      - run: pnpm run test:all

      - run: pnpm run build

      # Every entry point resolves through "exports", and nothing else does
      - run: pnpm run check-exports

      # The packed package, installed globally, runs a project's commands; a consumer can ship its own name
      - run: pnpm run check-bin

      # Real processes racing for the registry lock each get their own slot
      - run: pnpm run check-lock

      # What would be published, without publishing it
      - run: npm publish --dry-run

      # The command the release workflow runs, without staging anything (npm 12 needs Node 24 here)
      - if: matrix.node == 24
        run: npx -y npm@12.2.1 stage publish --dry-run --access public
