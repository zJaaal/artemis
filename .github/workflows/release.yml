name: Release

on:
  push:
    tags: ['v*']

# The npm token is the repository secret NPM_TOKEN (never written in the repo). id-token is only for the
# provenance statement the published package gets.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 24 ships an npm CLI that can sign provenance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:all

      - run: pnpm run build

      - run: pnpm run check-exports

      - run: pnpm run check-bin

      - run: pnpm run check-lock

      - name: The tag must match the version in package.json
        run: |
          expected="v$(jq -r .version package.json)"

          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi

      # Publishing stays on the npm CLI: provenance is an npm feature
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
